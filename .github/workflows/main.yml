name: Build and Push Docker Images

on:
  push:
    branches:
      - test
      - qa
      - main
  pull_request:
    branches:
      - test
      - qa
      - main

env:
  AWS_REGION: us-east-1
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build_dockerhub_image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Login to DockerHub
        if: github.event_name == 'push'  # Only login on push events
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          # Use github.head_ref for pull requests and github.ref_name for pushes
          docker build -t lionsentry/lionsentry-react-front-end:${{ github.head_ref || github.ref_name }} .

      - name: Push Docker Image
        if: github.event_name == 'push'  # Only push on push events, not pull requests
        run: |
          docker push lionsentry/lionsentry-react-front-end:${{ github.ref_name }}
